<!DOCTYPE html>
<html lang="ko">
<link rel="stylesheet" href="02-example.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해외스냅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>해외스냅</h1>
</header>

<div class="wrap">

    <!-- 왼쪽 회색 띠 -->
    <aside class="side"><span>PROJECTS</span></aside>

    <main class="main">

        <!-- 상단 메뉴 -->
        <nav class="tabs">
            <a href="#">EDUCATION</a>
            <a href="#">FOOD</a>
            <a href="#">MEETING PEOPLE</a>
            <a href="#">CINEMA</a>
        </nav>

        <!-- 제목 줄 -->
        <div class="browse">
            <h2>BROWSE BY CLIENT</h2>
            <div class="views">
                <a href="#">FEATURED</a>
                <span>/</span>
                <a href="#">GALLERY</a>
                <span>/</span>
                <a href="#">LIST</a>
            </div>
        </div>

        <!-- 이미지 목록 -->
        <ul class="projects">
            <li>
                <img src="https://picsum.photos/id/1018/620/470" alt="">
                <p>나트랑</p>
            </li>
            <li>
                <img src="https://picsum.photos/id/1015/620/470" alt="">
                <p>보라카이</p>
            </li>
            <li>
                <img src="https://picsum.photos/id/1011/620/470" alt="">
                <p>괌</p>
            </li>
            <li>
                <img src="https://picsum.photos/id/1016/620/470" alt="">
                <p>하와이</p>
            </li>
            <li>
                <img src="https://picsum.photos/id/1019/620/470" alt="">
                <p>파리</p>
            </li>
            <li>
                <img src="https://picsum.photos/id/1036/620/470" alt="">
                <p>뉴욕</p>
            </li>
        </ul>

    </main>

    <!-- 오른쪽 회색 띠 -->
    <aside class="side"><span>PROJECTS</span></aside>

</div>

</body>
</html>
