<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="07-Homepage.css">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard-container">
    <!-- 왼쪽 영역 -->
    <div class="left-section">
        <!-- 첫 번째 카드 (왼쪽 위) -->
        <div class="card card-small">
            <div class="disk-info">
                <div class="disk-icon"></div>
                <div class="disk-text">
                    <span class="capacity">4TB</span>
                    <div class="dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 두 번째 카드 (오른쪽 위) -->
        <div class="card card-small">
            <div class="disk-info">
                <div class="disk-icon"></div>
                <div class="disk-text">
                    <span class="capacity">4TB</span>
                    <div class="dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 세 번째 카드 (왼쪽 아래) -->
        <div class="card card-small">
            <div class="disk-info">
                <div class="disk-icon"></div>
                <div class="disk-text">
                    <span class="capacity">4TB</span>
                    <div class="dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 네 번째 카드 (오른쪽 아래) - 이미 적용된 곳 -->
        <div class="card card-small">
            <div class="disk-info">
                <div class="disk-icon"></div>
                <div class="disk-text">
                    <span class="capacity">4TB</span>
                    <div class="dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card card-stats">
            <div class="stat-item">
                <span class="stat-label">Used (TB) / of Total</span>
                <span class="stat-value used">5.66</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Available (TB)</span>
                <span class="stat-value available">2.34</span>
            </div>
        </div>
        <div class="card card-buttons">
            <button class="btn">Manage Space</button>
            <button class="btn">Disc Settings</button>
            <button class="btn">Create Backup</button>
        </div>
    </div>

    <!-- 오른쪽 영역 -->
    <div class="right-section">
        <div class="card card-wide bg-blue">
            <span class="system-title">System Files</span>
            <span class="system-value">0.50TB</span>
        </div>
        <div class="card card-wide bg-yellow">
            <span class="system-title">System Files</span>
            <span class="system-value">0.50TB</span>
        </div>
        <div class="card card-wide bg-pink">
            <span class="system-title">System Files</span>
            <span class="system-value">0.50TB</span>
        </div>
        <div class="card card-wide bg-white">
            <span class="system-title">System Files</span>
            <span class="system-value">0.50TB</span>
        </div>
        <div class="card card-wide bg-green">
            <span class="system-title">System Files</span>
            <span class="system-value">0.50TB</span>
        </div>
    </div>
</div>
</body>
</html>
