<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Practice</title>
    <link rel="stylesheet" href="09-practice 2.css">
</head>
<body>

<!-- 전체 메인 프레임 (좌우 2단 대칭 구조) -->
<div class="main-container">

    <!-- [좌측 영역] -->
    <div class="left-section">
        <!-- 1. Flex! 큰 카드 -->
        <div class="card flex-card">
            <div class="badge-group">
                <span class="rating">★ 4.99</span>
                <span class="badge yellow-badge">BEST REVIEWS</span>
            </div>
            <div class="card-content">
                <h1 class="main-title">공성규 !</h1>
            </div>
            <div class="card-footer">
                <div class="divider"></div>
                <p class="description">
                    공성규 is awesome and we love 성규's phtos because<br>
                    we can make many things.
                </p>
            </div>
        </div>

        <!-- 2. 좌측 하단 이미지 2개 (01.jpg, 02.jpg 배치) -->
        <div class="left-bottom-group">
            <div class="card img-card">
                <img src="01.jpg" alt="사진 1">
            </div>
            <div class="card img-card">
                <img src="02.jpg" alt="사진 2">
            </div>
        </div>
    </div>


    <!-- [우측 영역: 5개 박스 구성] -->
    <div class="right-section">

        <!-- 상단 줄: 박스 1 (물결 그라데이션) + 박스 2 (다크 메뉴) -->
        <div class="right-top-row">
            <div class="card box1-gradient"></div>
            <div class="card box2-dark-menu">
                <ul class="menu-list">
                    <li>ABOUT</li>
                    <li>SOLUTIONS</li>
                    <li>PORTFOLIO</li>
                    <li>BLOG</li>
                </ul>
                <div class="hire-us">Hire Us ➔</div>
            </div>
        </div>

        <!-- 중단 줄: 박스 3 (버튼 영역) + 박스 4 (03.jpg 이미지 배치) -->
        <div class="right-mid-row">
            <div class="box3-action">
                <button class="btn btn-yellow">RECENT COLLABS</button>
                <button class="btn btn-white-rotated">RECENT COLLABS</button>
                <span class="more-cases">MORE CASES</span>
            </div>
            <div class="card box4-tech-img">
                <img src="03.jpg" alt="사진 3">
            </div>
        </div>

        <!-- 하단 줄: 박스 5 (하단 흰색 큰 텍스트 카드) -->
        <div class="card box5-text-card">
            <video src="video.mp4" autoplay loop muted playsinline></video>
        </div>

    </div>

</div>

</body>
</html>
